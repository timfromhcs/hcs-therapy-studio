<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <meta name="theme-color" content="#2f4f3e" />
    <meta
      name="description"
      content="HCS Therapy Studio — a local-first wellbeing, psychoeducation and AI research studio. CPU or Vulkan inference on your own machine. No cloud, no telemetry."
    />
    <meta name="color-scheme" content="light dark" />
    <!-- No analytics, no fonts from a CDN, no third-party script. The client
         talks only to 127.0.0.1 and ships its font with the bundle. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self' http://127.0.0.1:* http://localhost:*; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'none'" />
    <title>HCS Therapy Studio</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
