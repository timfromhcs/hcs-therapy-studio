# CPU LoRA pipeline smoke — 0.6B base model
#
# Why this config exists: the 1.7B config (cpu-lora-smoke.yaml) needs ~6.5 GiB of
# peak RAM, and the measured safe budget on the development machine was 1.3 GiB
# while a browser and IDE were open. Rather than pretend the big run fits, the
# pipeline is validated on the 0.6B sibling, which shares the architecture
# (28 layers, 8 KV heads, head_dim 128) in a smaller hidden size.
#
# A run with this config proves: dataset gating, tokenisation, LoRA attachment,
# step execution, loss reporting, checkpoint save and resume. It proves nothing
# about output quality, and it is non-promotable.

run:
  name: cpu-lora-smoke-0_6b
  notes: Pipeline validation on a 0.6B base. Non-promotable.
  promotable: false

base_model:
  id: qwen3-0.6b-base
  revision: da87bfb608c14b7cf20ba1ce41287e8de496c0cd
  dtype: auto_safe
  trust_remote_code: false

dataset:
  directory: datasets/train
  source_id: hcs-synthetic-seed
  allow_smoke: true
  max_seq_length: 512
  validation_split: 0.0

training:
  method: lora_sft
  use_cpu: true
  precision: auto_safe
  batch_size: 1
  gradient_accumulation_steps: 4
  learning_rate: 0.0002
  warmup_ratio: 0.03
  max_steps: 10
  save_steps: 5
  eval_steps: 5
  seed: 42
  gradient_checkpointing: true
  num_workers: 0
  optimizer: adamw_torch
  resume_from_checkpoint: true
  report_to: none

lora:
  r: 8
  alpha: 16
  dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj]

memory:
  max_ram_fraction: 0.6
  # 1.0 GiB reserve rather than 3.0: this run loads a 0.6B model (~2.2 GiB peak)
  # and the estimate already includes a conservative activation factor. The guard
  # still refuses when the estimate does not fit.
  reserve_gib: 1.0
  refuse_on_insufficient: true

output:
  adapter_dir: models/adapters/cpu-lora-smoke-0_6b
  checkpoint_dir: models/experiments/cpu-lora-smoke-0_6b
  keep_last_checkpoints: 2

gates:
  require_reviewed_data: true
  require_eval_report: false
  max_safety_regression: 0.0
  min_dimension_delta: 0.0
