<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 680" width="1120" height="680" role="img" aria-label="Crisis gate decision flow: a deterministic check runs before the model, with four outcomes from normal conversation to an imminent hand-off">
  <title>Crisis gate flow</title>
  <defs>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#7a8a80"/>
    </marker>
    <marker id="a2r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#b8432c"/>
    </marker>
    <style>
      .node { fill: #ffffff; stroke: #cfd8cd; stroke-width: 1.5; }
      .decision { fill: #f3f8f4; stroke: #7fa88b; stroke-width: 1.75; }
      .danger { fill: #fdf1ee; stroke: #b8432c; stroke-width: 1.75; }
      .ok { fill: #f2f8f3; stroke: #3f6b52; stroke-width: 1.75; }
      .warn { fill: #fdf7ec; stroke: #c9a227; stroke-width: 1.75; }
      .t { font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #1d2a22; font-size: 12.5px; }
      .h { font-family: 'Segoe UI', Arial, sans-serif; font-weight: 600; fill: #1d2a22; font-size: 14px; }
      .q { font-family: 'Segoe UI', Arial, sans-serif; fill: #6b7a70; font-size: 11.5px; }
      .edge { stroke: #7a8a80; stroke-width: 1.75; fill: none; }
      .edgeRed { stroke: #b8432c; stroke-width: 1.75; fill: none; }
      .lbl { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11px; fill: #5b6b61; }
    </style>
  </defs>

  <rect width="1120" height="680" fill="#fbfbf9"/>

  <!-- grid helpers: central 360..760, left 40..320, right 800..1080 -->

  <!-- start -->
  <rect class="node" x="430" y="24" width="260" height="46" rx="23"/>
  <text class="h" x="560" y="53" text-anchor="middle">user message arrives</text>
  <path class="edge" d="M560 70 V104" marker-end="url(#a2)"/>

  <!-- decision 1 -->
  <rect class="decision" x="360" y="104" width="400" height="78" rx="10"/>
  <text class="h" x="380" y="130">1 · explicit intent AND imminence?</text>
  <text class="q" x="380" y="152">"ich bringe mich heute Nacht um" · "I will kill myself tonight"</text>
  <text class="q" x="380" y="170">EN + DE patterns; negation and quoting excluded</text>

  <path class="edgeRed" d="M760 141 H780 V196" marker-end="url(#a2r)"/>
  <text class="lbl" x="764" y="132" fill="#8f3323">yes</text>
  <path class="edge" d="M560 182 V222" marker-end="url(#a2)"/>
  <text class="lbl" x="570" y="206">no</text>

  <!-- imminent (right) -->
  <rect class="danger" x="800" y="196" width="280" height="106" rx="10"/>
  <text class="h" x="818" y="222" fill="#8f3323">CRISIS_IMMINENT</text>
  <text class="t" x="818" y="244">the model is not called</text>
  <text class="t" x="818" y="263">reviewed template, verified</text>
  <text class="t" x="818" y="282">numbers, tools blocked</text>

  <!-- decision 2 -->
  <rect class="decision" x="360" y="222" width="400" height="78" rx="10"/>
  <text class="h" x="380" y="248">2 · elevated signal, or concern for someone else?</text>
  <text class="q" x="380" y="270">"mein Bruder hat gesagt …" · "ich ritze mich wieder"</text>
  <text class="q" x="380" y="288">a third party gets the same hand-off, not silence</text>

  <path class="edge" d="M360 261 H320" marker-end="url(#a2)"/>
  <text class="lbl" x="326" y="252">yes</text>
  <path class="edge" d="M560 300 V338" marker-end="url(#a2)"/>
  <text class="lbl" x="570" y="322">no</text>

  <!-- supportive (left) -->
  <rect class="warn" x="40" y="196" width="280" height="106" rx="10"/>
  <text class="h" x="58" y="222" fill="#7d6414">CRISIS_SUPPORTIVE</text>
  <text class="t" x="58" y="244">the model is also bypassed</text>
  <text class="t" x="58" y="263">resources shown once, plainly</text>
  <text class="t" x="58" y="282">one clarifying question at most</text>

  <!-- decision 3 -->
  <rect class="decision" x="360" y="338" width="400" height="78" rx="10"/>
  <text class="h" x="380" y="364">3 · was there a crisis earlier in this session?</text>
  <text class="q" x="380" y="386">a three-turn attentive window, carried by the client</text>
  <text class="q" x="380" y="404">the server stores no conversation</text>

  <path class="edge" d="M360 377 H320" marker-end="url(#a2)"/>
  <text class="lbl" x="326" y="368">yes</text>
  <path class="edge" d="M560 416 V450" marker-end="url(#a2)"/>
  <text class="lbl" x="570" y="438">no</text>

  <!-- attentive (left) -->
  <rect class="ok" x="40" y="330" width="280" height="78" rx="10"/>
  <text class="h" x="58" y="356" fill="#2f4f3e">NORMAL, attentive</text>
  <text class="t" x="58" y="378">the model answers, with a suffix:</text>
  <text class="t" x="58" y="396">acknowledge, slow down, one question</text>

  <!-- normal (centre) -->
  <rect class="ok" x="430" y="450" width="260" height="66" rx="10"/>
  <text class="h" x="560" y="476" text-anchor="middle" fill="#2f4f3e">NORMAL</text>
  <text class="t" x="560" y="498" text-anchor="middle">model answers, tools allowed</text>

  <path class="edge" d="M560 516 V550" marker-end="url(#a2)"/>

  <!-- guard -->
  <rect class="node" x="320" y="550" width="480" height="70" rx="10"/>
  <text class="h" x="340" y="576">4 · output guard, always after generation</text>
  <text class="t" x="340" y="598">diagnosis · medication · false certainty · dependence ·</text>
  <text class="t" x="340" y="614">invented hotline · mixed du/Sie register</text>

  <text class="q" x="40" y="652">Every branch above is covered by a test. The trajectory suite asserts the ordering across turns, not just one reply.</text>
</svg>
