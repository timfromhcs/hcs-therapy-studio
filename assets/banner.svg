<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" role="img" aria-label="HCS Therapy Studio — a local-first wellbeing studio">
  <title>HCS Therapy Studio</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10201a"/>
      <stop offset="52%" stop-color="#1b3327"/>
      <stop offset="100%" stop-color="#2f4f3e"/>
    </linearGradient>
    <linearGradient id="loam2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3f6b52"/>
      <stop offset="100%" stop-color="#7fa88b"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.18" cy="0.32" r="0.6">
      <stop offset="0%" stop-color="#7fa88b" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#7fa88b" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="320" fill="url(#bg)"/>
  <rect width="1280" height="320" fill="url(#glow)"/>

  <!-- ripple motif: the same three breaths as the mark, scaled and faded -->
  <g fill="none" stroke="#9fc0ab" stroke-linecap="round" opacity="0.22">
    <path d="M760 250 A190 190 0 0 1 1140 250" stroke-width="7"/>
    <path d="M815 250 A135 135 0 0 1 1085 250" stroke-width="7"/>
    <path d="M870 250 A80 80 0 0 1 1030 250" stroke-width="7"/>
  </g>

  <g transform="translate(64, 84)">
    <rect width="152" height="152" rx="34" fill="url(#loam2)"/>
    <g fill="none" stroke="#ffffff" stroke-linecap="round">
      <path d="M36 104 A40 40 0 0 1 116 104" stroke-width="6" opacity="0.45"/>
      <path d="M48 104 A28 28 0 0 1 104 104" stroke-width="6" opacity="0.7"/>
      <path d="M60 104 A16 16 0 0 1 92 104" stroke-width="6" opacity="0.95"/>
    </g>
    <circle cx="76" cy="104" r="5.4" fill="#f3f8f4"/>
  </g>

  <g font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" fill="#f3f8f4">
    <text x="252" y="150" font-size="54" font-weight="600" letter-spacing="-0.5">HCS Therapy Studio</text>
    <text x="252" y="196" font-size="25" fill="#b9d3c3">A local-first wellbeing, psychoeducation and AI research studio.</text>
    <text x="252" y="236" font-size="20" fill="#8fb3a0" letter-spacing="0.4">CPU or Vulkan inference · no cloud · no telemetry · Apache-2.0 code</text>
  </g>

  <text x="1216" y="284" text-anchor="end" font-family="'Segoe UI', Arial, sans-serif" font-size="17" fill="#6f9384">Made with love by hcsmedia and timfromhcs</text>
</svg>
